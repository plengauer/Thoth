# MegaLinter main configuration for Thoth. MegaLinter only auto-discovers its
# main config in the repository root, so it is loaded from here through
# MEGALINTER_CONFIG in analyze.yml and in test_github.yml
# (job-integration-megalinter). The per-linter configs are in .github/linters.
# Added following a full triage of the 2026-07-24 Analyze workflow run (#3833).
# Extended following a triage of the 2026-11-27 Analyze run: the findings of the
# `quality` job whose linters produce no SARIF output (and are therefore not in
# code scanning) were each fixed or muted, in the pull requests that target this
# one.
# Every entry is preceded by why it exists. "#1234" refers to the pull request
# of this repository that introduced the entry (or the issue it fixed).
# All options: https://megalinter.io/latest/configuration/

# --- Linters that are switched off ---
DISABLE_LINTERS:
  # Why (#3833): BASH_EXEC checks that every discovered shell script has the
  # executable bit set. Every script in this repo is invoked via an explicit
  # interpreter - `wget ... | sh` per INSTALL.sh's own documented usage,
  # `. otel.sh` / `. otelapi.sh` sourcing, `bash path/to/script.sh` from
  # composite actions and test harnesses, or spawned from main.js via a Node
  # child process - never `./script.sh` directly, so this check doesn't apply.
  - BASH_EXEC
  # Why: black and isort only check formatting. The Python code does not follow
  # their style: sdk.py would change in about 650 lines and sdk_factory.py in
  # about 40 (only deep.py is close, with 8), and the repository mixes quote and
  # indentation styles between files. A reformat of the core SDK file would
  # touch nearly every line without changing behavior and would make every open
  # change conflict. Same reasoning as for JAVASCRIPT_STANDARD below.
  - PYTHON_BLACK
  - PYTHON_ISORT
  # Why (#3833): "standard" (JavaScript Standard Style) is a zero-config,
  # semicolon-free style guide. This codebase consistently uses semicolons, so
  # the large majority of findings were just "Extra semicolon" from that
  # philosophy clash rather than real issues, and standard doesn't support
  # disabling individual sub-rules. #3833 points to a tracking issue for the
  # small number of genuinely useful catches (unused vars, camelCase, etc.)
  # that this trades away.
  - JAVASCRIPT_STANDARD
  # Why: pyright ran without any configuration over 4 Python files that use the
  # dynamically typed OpenTelemetry API and reported 28 errors, 26 of them in
  # sdk.py (13 findings, doubled because opentelemetry_shell_sdk.py is a symlink
  # to it). Most are false positives of the same two kinds: Optional access on
  # module level state that the init commands always set (`final_resources`,
  # `span.context`, `span.attributes`) and API types without the SDK methods
  # (`shutdown` on the providers). The 3 real findings (a private import of
  # SeverityNumber, StatusCode imported from a module that does not export it,
  # and an implicit submodule import in deep.py) were fixed. mypy is configured
  # and already type checks the same files, so a second type checker only adds
  # noise.
  - PYTHON_PYRIGHT
  # Why (#4355): devskim reported ~21k untriaged findings (errors) in the last
  # completed `quality` run (#7477) and took ~7 of its ~12 minutes (see also
  # #3848). It is disabled outright instead of filtered out of the SARIF, so it
  # neither runs nor buries the findings of the other linters, and everything
  # MegaLinter still produces is uploaded to code scanning unfiltered.
  - REPOSITORY_DEVSKIM
  # Why: YAML_PRETTIER only checks formatting, and no single setting makes the
  # files pass. The workflows mix single and double quotes (`singleQuote: true`
  # still leaves 16 of the 28 reported files), and prettier puts one space
  # before an inline comment where yamllint's `comments` rule asks for two,
  # which is also what Renovate writes in the `@<sha> # v1.2.3` pins. Some of
  # the reported files are generated (agentics-maintenance.yml). yamllint covers
  # the structural checks of YAML files. The analyze template of
  # plengauer.github.io disables it for the same reasons.
  - YAML_PRETTIER

# --- Files excluded from all linters that receive a file list ---
# Why (#3833, #3863, fixes #3845): MegaLinter flagged lint errors in generated
# or captured files that are not hand-authored source, producing noisy false
# positives across yamllint, actionlint, the JSON linters, prettier, shfmt and lychee.
# - *.lock.yml under .github/workflows/ are compiled by the gh-aw CLI from the
#   sibling *.md files (see recompile_agentic_workflows.yml) - not hand-written.
# - **/otlp.json under demos/ are captured OpenTelemetry export output
#   (multiple concatenated JSON documents, not one JSON document per file),
#   refreshed by refresh_demos.yml - not hand-written, and not valid
#   single-document JSON by design.
# - **/gradlew is the standard Gradle wrapper script, vendored boilerplate.
# - **/package-lock.json is an npm-generated lockfile.
# This filter is NOT applied to linters running in CLI lint mode `project`
# (MegaLinter does not hand them a file list), see jscpd below.
FILTER_REGEX_EXCLUDE: "(\\.lock\\.yml|/otlp\\.json|/gradlew|/package-lock\\.json)$"

# --- Per-linter entries that have to stay here ---
# These cannot move into a linter-native config under .github/linters:
# - v8r only discovers its config (.v8rrc.*) from the working directory
#   upwards and has no option to point to one, so it would have to live in the
#   repository root.
# - shfmt only reads .editorconfig, which also belongs in the repository root.
# - ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES is a MegaLinter mechanism for passing
#   an environment variable to zizmor, not a zizmor setting.
# - trivy only reads .trivyignore (plain IDs, no paths) by default. The
#   path-scoped YAML ignore file has to be passed explicitly with --ignorefile.

# Why (#4155, requested in the review of #4128): v8r resolves the bare `on:` key
# of a workflow to a YAML 1.1 boolean before validating it against the generic
# GitHub workflow schema. That is a v8r/MegaLinter artifact GitHub itself does
# not care about. Excluding workflows from v8r avoids quoting `on:` in every
# workflow, while actionlint and zizmor keep validating them.
YAML_V8R_FILTER_REGEX_EXCLUDE: "\\.github/workflows/"
# Why: cspell reported 1170 unknown words in 336 files (440 distinct ones). 334
# are in the generated demos/*/README.md (ignored in .cspell.json), and most of
# the rest are identifiers, commands and options in shell scripts, workflows
# and tests (`endswith`, `mktemp`, `zstd`, `execdir`, ...). Spelling is worth
# checking in the documentation, where it found 8 real typos (fixed), but not
# worth keeping hundreds of code identifiers in the word list. So cspell only
# receives the markdown files.
SPELL_CSPELL_FILTER_REGEX_INCLUDE: "\\.md$"
# Why: demos/*/demo.sh (and child.sh) are documentation snippets without a
# shebang, because refresh_demos.yml runs them with `bash -e demo.sh` and pastes
# them verbatim into the README of each demo. ShellCheck can't tell their dialect
# (SC2148, 15 alerts). A `# shellcheck shell=` line in each file would show up in
# every README and shift the line numbers recorded in the demo's traces. Setting
# `shell=` in .shellcheckrc is not an option either: it overrides the shebang of
# every script (tested, 88 new findings in the POSIX scripts). That leaves
# excluding these files from ShellCheck.
BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: "(^|/)demos/[^/]+/[^/]+\\.sh$"
# Why (#3869, fixes #3840): shfmt flagged formatting diffs on ~60% of the shell
# files because no shfmt configuration existed and its tab-indent default
# conflicts with the codebase's 2-space style. `-i 2` indents with 2 spaces,
# `-ci` indents `case` bodies. #4128 renamed the key from SHELL_SHFMT_ARGUMENTS,
# which #4128 describes as deprecated/unsupported.
BASH_SHFMT_ARGUMENTS: "-i 2 -ci"
# Why: cpplint follows the Google C++ style, which this repository does not.
# - legal/copyright (1 per C file): it requires a copyright line in every file,
#   but the license is in LICENSE and no source file has a header.
# - whitespace/comments: it requires two spaces before a trailing comment,
#   whereas clang-format (LLVM style, which the C files pass) requires exactly
#   one, so the two checks contradict each other.
# The other cpplint rules stay active. Config files are not an option here:
# cpplint is only identified by MegaLinter, it has no config file that is
# picked up from .github/linters.
C_CPPLINT_ARGUMENTS: "--filter=-legal/copyright,-whitespace/comments"
# Why (#3854, fixes #3844): without this, zizmor makes unauthenticated GitHub
# API calls that fail with 401 Unauthorized (seen in the `artipacked` audit)
# instead of producing audit results. analyze.yml already provides the token.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
# Why: markdownlint reported 18 findings (MD013 line length 10x, MD010 hard tabs
# 8x) and all but one are in files that are not hand-written documentation.
# - demos/*/README.md are generated by refresh_demos.yml from demo.sh, meta.json
#   and the captured output. Their long lines are embedded JSON and the tabs
#   come from the output of `printf %s:<TAB>%s`, so neither can be fixed at the
#   source. demos/README.md is hand-written and stays checked.
# - .github/workflows/*.md (autotriage.md, monitor_changelog.md) are the
#   sources of agentic workflows, so their body is the prompt of an AI agent,
#   one long line per instruction, not documentation. The analyze template of
#   plengauer.github.io excludes them for the same reason.
# The remaining finding (a 439 character line in copilot-instructions.md) was
# wrapped.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: "(^|/)demos/[^/]+/README\\.md$|\\.github/workflows/[^/]*\\.md$"
# Why: trivy (REPOSITORY_TRIVY) does not read the checkov or hadolint
# suppression comments in the Dockerfiles, so their DS-0002 and DS-0029
# findings were uploaded to code scanning anyway. Its inline `trivy:ignore`
# comments most likely cannot cover DS-0002 either: that finding (no USER at
# all) has no source line (it is reported at 1:1), and inline ignores only match
# a finding on the comment's line or the next one. The ignore file scopes each
# rule to the affected Dockerfiles and records why.
REPOSITORY_TRIVY_ARGUMENTS:
  - --ignorefile
  - .github/linters/.trivyignore.yaml
# Why: prettier reformatted 4 JSON files. renovate.json (trailing whitespace
# and expanded short arrays) and demos/injection_inner_xargs_parallel/meta.json
# (a leading blank line) were reformatted. The two Dynatrace dashboards in
# dashboards/dynatrace are excluded: they are exported from Dynatrace as is, so
# any re-export brings the original formatting back.
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: "(^|/)dashboards/"

# --- Reasons for entries in the per-linter configs that cannot hold comments ---
# MegaLinter picks up the per-linter configs in .github/linters by their
# default names, so nothing has to be configured here for them.
#
# .jscpd.json: jscpd runs in CLI lint mode `project`, so FILTER_REGEX_EXCLUDE
# does not apply to it and the generated-file exclusions are repeated in its own
# config. The duplication is intentional. jscpd rejects comments in its config
# (tested with jscpd 5.4.1: "key must be a string"), so the reasons are here:
# - threshold 5 (#3833): MegaLinter's own default is 0%, which fails on any repo
#   with normal duplication; the threshold is raised to 5%.
# - ignore, generated files (#3833, #3863): the same patterns as
#   FILTER_REGEX_EXCLUDE above, expressed as globs.
# - ignore, **/node_modules/** and **/.git/**: added in #3833, which gives no
#   reason for them. They are needed: jscpd 5.4.1 scans both directories by
#   default (tested), and MegaLinter's jscpd descriptor does not forward its
#   default excluded directories (.git, node_modules) to jscpd.
# - ignore, **/.github/workflows/**: workflow files repeat the same checkout,
#   setup and permissions boilerplate. GitHub Actions has no way to share it
#   between files other than reusable workflows. Measured on this repository:
#   together with the next entry it takes jscpd from 833 clones / 32.3% to
#   111 clones / 10.6%.
# - ignore, **/demos/*/README.md: these files are generated by refresh_demos.yml
#   from demo.sh, meta.json and the recorded spans, so their embedded JSON
#   duplicates by construction (564 of the 833 clones).
# - ignore, **/dashboards/**: the two Dynatrace dashboards are exported JSON
#   documents with the same tile structure, which duplicates by construction
#   (27 clones).
# - ignore, **/tests/**: every test is a standalone script that repeats the
#   same setup, so that a failing test can be run and read on its own (15
#   clones).
# - ignore, **/demos/**: the demo scripts are standalone snippets that are
#   pasted verbatim into the READMEs.
#   Together, these three entries take jscpd from 109 clones to 66.
# - minTokens 200 (default 50): 64 of the remaining 66 clones are blocks of 50
#   to 200 tokens, which are small repeated passages rather than copied
#   functions. At 200 two clones are left: agent.instrumentation.curl.sh and agent.instrumentation.gh.sh
#   share a block of about 360 tokens, and agent.instrumentation.gh.sh contains
#   a block of about 220 tokens twice. These are real copy and paste that
#   can only be resolved by refactoring those two files. Measured with jscpd
#   5.4.1: minTokens 100 leaves 35 clones and 5.08% duplication, which is
#   above the 5% threshold and would fail the linter.
# - reporters console and html: added in #3833, which gives no reason for them.
#   MegaLinter's jscpd descriptor also passes `--reporters console,html`.
#
# .cspell.json: kept as plain JSON (plain JSON has no comments, and the file
# has to keep its .json name for MegaLinter's default lookup), so its reasons
# are recorded here too.
# - $schema, version, language (#3857): came with the original file, which
#   gives no reason for them.
# - words (#3857, fixes #3843): cspell flagged 3,215 instances across 382
#   legitimate technical terms - project-specific jargon, tool names, shell
#   keywords and third-party proper nouns - as unknown words. None are typos.
#   #3857 groups them as OpenTelemetry, shell, Azure, TLS and certificate
#   authorities, tooling, project names, Debian packaging, dev and CI tools,
#   networking, plus further terms without a category.
# - ignorePaths: **/demos/*/README.md. These files are generated by
#   refresh_demos.yml and embed captured output (334 unknown words). demos/README.md
#   is hand-written and stays checked. #3857 had *.lock and .git/**. No *.lock
#   files are tracked, the generated *.lock.yml files are kept away by
#   FILTER_REGEX_EXCLUDE above, and MegaLinter never hands cspell files from
#   .git because it excludes .git and node_modules from its file lists by
#   default.
# - words added in this pull request: shfmt, sarif, devskim, artipacked,
#   untriaged (used in the comments of this file), agentics (a path in
#   actionlint.yml), rcfile and scriptdir (used in .shellcheckrc).
# - words trivy, trivyignore and ignorefile: used in the REPOSITORY_TRIVY
#   comments of this file and in .trivyignore.yaml.
# - words added with the markdown-only restriction (the 8 typos found in the
#   documentation were fixed instead): packaging terms used in the skills and
#   contributor docs (abuild, apkbuild, deinstall, libc, mawk, procps, postrm,
#   preinst, rpmbuild), placeholders in examples (mycommand, myspan, numberkey,
#   yourfeature), `toolsets` (a key of the agentic workflow front matter),
#   `recompiles`, `sameorigin` (a cookie attribute) and `olwcn` (a fragment of
#   the sample cookie value in README.md).
