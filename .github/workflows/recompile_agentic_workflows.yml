name: 'Recompile Agentic Workflows'

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.md'
      - .github/workflows/recompile_agentic_workflows.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  recompile:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        with:
          secrets_to_redact: '${{ github.token }}

            ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

            ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}'
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: '${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}'
          OTEL_EXPORTER_OTLP_HEADERS: '${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}'
      - id: broker
        env:
          BROKER_URL: https://github-token-broker-152120470600.europe-west1.run.app
        run: |
          set -e
          oidc_jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BROKER_URL" | sed -n 's/.*"value": *"\([^"]*\)".*/\1/p')"
          echo "::add-mask::$oidc_jwt"
          token="$(curl -sSf -X POST "$BROKER_URL/token" -H "Authorization: Bearer $oidc_jwt" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')"
          [ -n "$token" ]
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.broker.outputs.token }}
      - env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
        run: |
          gh extension install github/gh-aw
          gh aw compile --approve
      - uses: plengauer/opentelemetry-github/actions/instrument/deploy-local@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        with:
          github_token: ${{ steps.broker.outputs.token }}
          job_level_instrumentation_exclude: 'Refresh Demos,Test Package Repositories,Shell,GitHub,Workflow Example,Experiment'
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: '${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}'
          OTEL_EXPORTER_OTLP_HEADERS: '${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}'
      - id: push
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          if gh api user --jq .id; then
            user_id="$(gh api user --jq .id)"
            user_name="$(gh api user --jq .login)"
          else
            user_name="github-actions[bot]"
            user_id="$(gh api /users/"$user_name" --jq .id)"
          fi
          git config user.name "$user_name"
          git config user.email "${user_id}+${user_name}@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "recompile agentic workflows"
          git push && echo "pushed=true" >> "$GITHUB_OUTPUT" || echo "pushed=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
      - if: steps.push.outputs.pushed == 'false'
        id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.broker.outputs.token }}
          commit-message: "recompile agentic workflows"
          base: ${{ github.ref_name }}
          branch: "recompile-aw/${{ github.ref_name }}"
          title: "Recompile Agentic Workflows"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - if: steps.open-pr.outputs.pull-request-number != null
        run: sleep 60 # make sure PR state is updated and API can catch up
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
        continue-on-error: true
