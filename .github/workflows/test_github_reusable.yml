name: 'Reusable Workflow Test'
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages.deb.${{ inputs.ref }}
      - run: |
          nohup node -e '
          const fs = require("fs");
          require("http").createServer((req, res) => {
            const chunks = [];
            req.on("data", chunk => chunks.push(chunk));
            req.on("end", () => {
              if (req.url === "/v1/traces") fs.appendFileSync("/tmp/traces.json", Buffer.concat(chunks).toString() + "\n");
              res.writeHead(200);
              res.end();
            });
          }).listen(8080);
          ' 1>/dev/null 2>/dev/null &
      - uses: ./actions/instrument/job
        with:
          cache: 'false'
        env:
          OTEL_LOGS_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:8080/v1/traces
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/json
          OTEL_SHELL_CONFIG_GITHUB_INJECT_ON_MAIN: 'TRUE'
          OTEL_SHELL_SDK_OUTPUT_REDIRECT: /dev/null
      - run: echo 'reusable workflow test'
      - run: sleep 60
      - run: |
          jq -se --arg expected "$GITHUB_WORKFLOW_REF" '
            any(.[].resourceSpans[]?.resource.attributes[]?;
              .key == "github.actions.workflow.ref" and .value.stringValue == $expected
            )
          ' /tmp/traces.json
          jq -se --arg expected "${{ github.repository }}/.github/workflows/test_github_reusable.yml@${{ github.ref }}" '
            any(.[].resourceSpans[]?.resource.attributes[]?;
              .key == "github.actions.job.workflow.ref" and .value.stringValue == $expected
            )
          ' /tmp/traces.json
          jq -se --arg expected "${{ github.sha }}" '
            any(.[].resourceSpans[]?.resource.attributes[]?;
              .key == "github.actions.job.workflow.sha" and .value.stringValue == $expected
            )
          ' /tmp/traces.json
          jq -se --arg expected "${{ github.repository }}" '
            any(.[].resourceSpans[]?.resource.attributes[]?;
              .key == "github.actions.job.workflow.repository" and .value.stringValue == $expected
            )
          ' /tmp/traces.json
          jq -se --arg expected ".github/workflows/test_github_reusable.yml" '
            any(.[].resourceSpans[]?.resource.attributes[]?;
              .key == "github.actions.job.workflow.file_path" and .value.stringValue == $expected
            )
          ' /tmp/traces.json
