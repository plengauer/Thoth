name: Renovate

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 0 * * 1'
  release:
    types: published

concurrency:
  group: renovate

jobs:

  renovate-dependencies:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        with:
          secrets_to_redact: '["${{ github.token }}","${{ secrets.ACTIONS_GITHUB_TOKEN }}"]'
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: '${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}'
          OTEL_EXPORTER_OTLP_HEADERS: '${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}'
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}

  renovate-list-instrumentations-python:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    env:
      OTEL_KILL_SWITCH: 1
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.ACTIONS_GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cd src/usr/share/opentelemetry_shell/agent.instrumentation.python
          (
            python3 -m venv venv_instrumentations
            . venv_instrumentations/bin/activate
            pip3 install opentelemetry-instrumentation traceloop-sdk >&2
            python3 -c '
          from packaging.requirements import Requirement
          from opentelemetry.instrumentation.bootstrap_gen import default_instrumentations, libraries
          print(*(Requirement(s).name for s in default_instrumentations), sep="\n")
          print(*(Requirement(e["instrumentation"]).name for e in libraries), sep="\n")
          '
            pip3 list --format json | jq .[].name -r
            deactivate
            rm -rf venv_instrumentations
          ) | grep -v '^$' | grep -E '^opentelemetry-instrumentation-' | sort -u | while read -r instrumentation; do
            if ! grep -qF "$instrumentation" requirements.txt; then
              echo "$instrumentation==$(pip3 index versions --pre "$instrumentation" | sed -n '1s/.*(\(.*\)).*/\1/p')" >> requirements.txt
            fi
          done
      - id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          commit-message: "Renovate python instrumentation list"
          base: main
          branch: "renovate-manual/python-list-instrumentations"
          title: "Update Python Instrumentation List"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - run: sleep 60 # make sure PR state is updated and API can catch up
        if: steps.open-pr.outputs.pull-request-number != null
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        continue-on-error: true

  renovate-list-instrumentations-node:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    env:
      OTEL_KILL_SWITCH: 1
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.ACTIONS_GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cd src/usr/share/opentelemetry_shell/agent.instrumentation.node
          (npm view @opentelemetry/auto-instrumentations-node dependencies --json; npm view @traceloop/node-server-sdk dependencies --json) | jq -r 'keys[]' | grep -E '^@(opentelemetry|traceloop)/instrumentation-' | while read -r instrumentation; do
            if ! jq -e --arg i "$instrumentation" '.dependencies[$i] or (.excludedInstrumentations | index($i))' package.json > /dev/null; then
              jq --arg i "$instrumentation" --arg v "$(npm view "$instrumentation" version)" '.dependencies[$i] = $v' package.json > package.json.tmp && mv package.json.tmp package.json
            fi
          done
      - id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          commit-message: "Renovate node instrumentation list"
          base: main
          branch: "renovate-manual/node-list-instrumentations"
          title: "Update Node Instrumentation List"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - run: sleep 60 # make sure PR state is updated and API can catch up
        if: steps.open-pr.outputs.pull-request-number != null
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        continue-on-error: true

  renovate-package-dependency-python:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: '["${{ github.token }}","${{ secrets.ACTIONS_GITHUB_TOKEN }}"]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 -m venv venv
          . venv/bin/activate
          pip3 install -r src/opt/opentelemetry_shell/requirements.txt
          deactivate
          min_version_otel="$(cat venv/lib/python*/site-packages/opentelemetry_api-*.dist-info/METADATA | grep '^Requires-Python: ' | cut -d ' ' -f 2 | cut -d . -f 2)"
          rm -rf venv
          min_version_debian="$(cat meta/debian/control | grep '^Pre-Depends:' | tr ',' '\n' | grep -F -- 'python3 (>=' | cut -d '(' -f 2- | cut -d ')' -f 1 | cut -d ' ' -f 2 | cut -d . -f 2)"
          [ "$min_version_debian" -ge "$min_version_otel" ] || sed -i "s/python3 (>= $min_version_debian/python3 (>= 3.$min_version_otel/g" meta/debian/control
          min_version_rpm="$(cat meta/rpm/*.spec | grep '^Requires:' | tr ',' '\n' | grep -F -- 'python3 >=' | cut -d '=' -f 2- | cut -d . -f 2)"
          [ "$min_version_debian" -ge "$min_version_otel" ] || sed -i "s/python3 >= $min_version_rpm/python3 >= 3.$min_version_otel/g" meta/rpm/*.spec
      - id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          commit-message: "Renovate python dependency"
          base: main
          branch: "renovate-manual/debian-python"
          title: "Update Debian Python Dependency"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - run: sleep 60 # make sure PR state is updated and API can catch up
        if: steps.open-pr.outputs.pull-request-number != null
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        continue-on-error: true

  renovate-test-images:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: '["${{ github.token }}","${{ secrets.ACTIONS_GITHUB_TOKEN }}"]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -s --fail https://api.launchpad.net/devel/debian/series > /tmp/launchpad.debian.json
          oldest="debian:$(jq < /tmp/launchpad.debian.json '.entries[] | select(.active == true) | select(.status == "Supported") | .name' -r | head -n 2 | tail -n 1)"
          stable="debian:$(jq < /tmp/launchpad.debian.json '.entries[] | select(.active == true) | select(.status == "Supported") | .name' -r | head -n 1)"
          latest="debian:$(jq < /tmp/launchpad.debian.json '.entries[] | select(.active == true) | select(.status == "Current Stable Release") | .name' -r)"
          dev="debian:$(jq < /tmp/launchpad.debian.json '.entries[] | select(.active == true) | select(.status == "Active Development" or .status == "Pre-release Freeze") | .name' -r | head -n 1)"
          cat .github/images.json | jq ".debian.oldest = \"$oldest\"" | jq ".debian.stable = \"$stable\"" | jq ".debian.latest = \"$latest\"" | jq ".debian.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
          cat .github/images.json | jq ".\"debian-slim\".oldest = \"$oldest-slim\"" | jq ".\"debian-slim\".stable = \"$stable-slim\"" | jq ".\"debian-slim\".latest = \"$latest-slim\"" | jq ".\"debian-slim\".dev = \"$dev-slim\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - run: |
          curl -s --fail https://api.launchpad.net/devel/ubuntu/series > /tmp/launchpad.ubuntu.json
          oldest="ubuntu:$(jq < /tmp/launchpad.ubuntu.json '.entries[] | select(.active == true) | select(.status == "Supported") | .name' -r | head -n 2 | tail -n 1)"
          stable="ubuntu:$(jq < /tmp/launchpad.ubuntu.json '.entries[] | select(.active == true) | select(.status == "Supported") | .name' -r | head -n 1)"
          latest="ubuntu:$(jq < /tmp/launchpad.ubuntu.json '.entries[] | select(.active == true) | select(.status == "Current Stable Release") | .name' -r)"
          if [ "$oldest" = 'ubuntu:jammy' ]; then oldest="$stable"; fi # for some reason, jammy is still listed, but its not supported, it seems to be a one-off. lets fix it like this here
          dev="ubuntu:$(jq < /tmp/launchpad.ubuntu.json '.entries[] | select(.active == true) | select(.status == "Active Development" or .status == "Pre-release Freeze") | .name' -r | head -n 1)"
          cat .github/images.json | jq ".ubuntu.oldest = \"$oldest\"" | jq ".ubuntu.stable = \"$stable\"" | jq ".ubuntu.latest = \"$latest\"" | jq ".ubuntu.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - run: |
          curl -s --fail https://fedoraproject.org/releases.json > /tmp/fedora_releases.json
          oldest="fedora:$(jq < /tmp/fedora_releases.json '.[].version' -r | cut -d ' ' -f 1 | sort -u | tail -n 2 | head -n 1)"
          stable="fedora:$(jq < /tmp/fedora_releases.json '.[].version' -r | cut -d ' ' -f 1 | sort -u | tail -n 1)"
          latest="$stable"
          dev=fedora:rawhide
          cat .github/images.json | jq ".fedora.oldest = \"$oldest\"" | jq ".fedora.stable = \"$stable\"" | jq ".fedora.latest = \"$latest\"" | jq ".fedora.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - run: |
          curl -s --fail https://endoflife.date/api/v1/products/opensuse > /tmp/opensuse.json
          oldest="opensuse/leap:$(jq < /tmp/opensuse.json '.result.releases[] | select(.isEol == false) | .name' -r | tail -n 1)"
          stable="opensuse/leap:$(jq < /tmp/opensuse.json '.result.releases[] | select(.isEol == false) | .name' -r | head -n 1)"
          latest=opensuse/tumbleweed:latest
          dev=opensuse/tumbleweed:latest
          cat .github/images.json | jq ".opensuse.oldest = \"$oldest\"" | jq ".opensuse.stable = \"$stable\"" | jq ".opensuse.latest = \"$latest\"" | jq ".opensuse.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - run: |
          curl -s --fail https://endoflife.date/api/v1/products/rhel > /tmp/rhel.json
          oldest="redhat/ubi$(jq < /tmp/rhel.json '.result.releases[] | select(.isEol == false) | .name' -r | tail -n 1):latest"
          stable="redhat/ubi$(jq < /tmp/rhel.json '.result.releases[] | select(.isEol == false) | .name' -r | head -n 2 | tail -n 1):latest"
          latest="redhat/ubi$(jq < /tmp/rhel.json '.result.releases[] | select(.isEol == false) | .name' -r | head -n 1):latest"
          dev="$latest"
          cat .github/images.json | jq ".rhel.oldest = \"$oldest\"" | jq ".rhel.stable = \"$stable\"" | jq ".rhel.latest = \"$latest\"" | jq ".rhel.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - run: |
          curl -s --fail https://endoflife.date/api/v1/products/alpine-linux > /tmp/alpine.json
          oldest="alpine:$(jq < /tmp/alpine.json '.result.releases[] | select(.isEol == false) | .name' -r | tail -n 1)"
          stable="alpine:$(jq < /tmp/alpine.json '.result.releases[] | select(.isEol == false) | .name' -r | head -n 2 | tail -n 1)"
          latest="alpine:$(jq < /tmp/alpine.json '.result.releases[] | select(.isEol == false) | .name' -r | head -n 1)"
          dev="$latest"
          cat .github/images.json | jq ".alpine.oldest = \"$oldest\"" | jq ".alpine.stable = \"$stable\"" | jq ".alpine.latest = \"$latest\"" | jq ".alpine.dev = \"$dev\"" > /tmp/images.json && cat < /tmp/images.json > .github/images.json
      - id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          commit-message: "Update test images"
          base: main
          branch: "renovate-manual/test-images"
          title: "Update Test Images"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - run: sleep 60 # make sure PR state is updated and API can catch up
        if: steps.open-pr.outputs.pull-request-number != null
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        continue-on-error: true

  renovate-license:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@5d34a21816f798c24f19857225b018a7f2af731f # v5.66.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: '["${{ github.token }}","${{ secrets.ACTIONS_GITHUB_TOKEN }}"]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sed -i "s/$(($(date +%Y) - 1))/$(date +%Y)/g" LICENSE
      - id: open-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          commit-message: "Renovate license date"
          base: main
          branch: "renovate-manual/license"
          title: "Update License Date"
          body: |
            (this PR is automatically generated)
          delete-branch: true
      - run: sleep 60 # make sure PR state is updated and API can catch up
        if: steps.open-pr.outputs.pull-request-number != null
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        continue-on-error: true

  renovate-job-level-instrumentation:
    if: ${{ !github.event.repository.fork && github.event.schedule == '0 0 * * 1' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - workflow: Copilot cloud agent
            prompt: |
              Check that the workflow that it didn't fail.
              Find the log mentioning the trace and span id and find and query all spans from any connected trace storage backend.
              Consider this test failed if any is true:
              *) the workflow failed or timed out
              *) any spans except the root span is orphaned (having a parent that is unavailable)
              *) there is at least one span with gen_ai attributes.
          - workflow: Copilot code review
            prompt: |
              Check that the workflow that it didn't fail.
              Find the log mentioning the trace and span id and find and query all spans from any connected trace storage backend.
              Consider this test failed if any is true:
              *) the workflow failed or timed out
              *) any spans except the root span is orphaned (having a parent that is unavailable)
              *) there is at least one span with gen_ai attributes.
          - workflow: Autotriage
            prompt: |
              Check that the workflow that it didn't fail.
              Find the log mentioning the trace and span id and find and query all spans from any connected trace storage backend.
              Consider this test failed if any is true:
              *) the workflow failed or timed out
              *) any spans except the root span is orphaned (having a parent that is unavailable)
              *) there is at least one span with gen_ai attributes in every step doing ai-based work.
          - workflow: any instrumented workflow that depends on another instrumented workflow - make sure its not a test run running the action locally but a properly instrumented workflow
            prompt: |
              Verify that the cache was warm when installing the action in the pre step. Compare to the code to search for indicators.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Your goal is to evaluate the correctness and behavior of the job-level instrumentation in this repository (${{ github.repository }}) in the context of a specific workflow (${{ matrix.workflow }}) with custom criteria.
            If the workflow run you select has been instrumented with any version but the latest, abort and do nothing.
            Before deep analysis or starting to fix, analyze if a fix has already been merged to main and it has not been released yet or if a related issue has been filed.
            If so, do nothing.            
            If the custom evaluation criteria below are not met, analyze by looking at the workflow code, the logs, as well as the instrumentation code and the traces, and find the root cause.
            File a detailed issue in the repository with all information, and relevant data like log snippets, suspected root causes and traces including links for all.
            If the issue affects the copilot coding agent or the autriage workflow, filing an issue will not work because it may not be picked up and implemented.
            In that case and in that case only, fix it yourself, open a PR, assign the owner of the repository, and enable automerge.
            For any non-git operations, use the gh cli via bash.
            These are the custom criteria to evaluate:
            ${{ matrix.prompt }}
          additional_permissions: |
            actions: write
          claude_args: |
            --model claude-opus-5.5
            --mcp-config '{"mcpServers": { "Dynatrace": { "command": "npx", "args": [ "mcp-remote", "${{ vars.DYNATRACE_MCP_URL }}", "--header", "Authorization: Bearer ${{ secrets.DYNATRACE_MCP_TOKEN }}" ] }}}'
            --allowedTools "Bash(*),mcp__Dynatrace__execute-dql,mcp__Dynatrace__create-dql,mcp__Dynatrace__explain-dql"
